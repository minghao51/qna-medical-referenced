site_name: Medical Q&A RAG Pipeline
site_url: https://minghao.github.io/qna_medical_referenced/
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.fold
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      theme: light
      include: ["*.ipynb"]
      allow_errors: true
      include_source: true
      show_input: true
      no_prompt: false
      ignore_h1_titles: true
      cache: true
      cache_dir: .cache/mkdocs-jupyter
extra_css:
  - stylesheets/jupyter-fix.css
extra_javascript:
  - javascripts/jupyter-theme-bridge.js
markdown_extensions:
  - pymdownx.blocks.caption
  - md_in_html
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
nav:
  - Home: index.md
  - Notebooks:
      - Overview: notebooks/index.md
      - Data Exploration: notebooks/01_data_exploration.ipynb
      - Chunking Strategy Analysis: notebooks/02_chunking_analysis.ipynb
      - Ingestion Pipeline: notebooks/03_ingestion_pipeline.ipynb
      - Retrieval Pipeline: notebooks/04_retrieval_pipeline.ipynb
      - Ablation Analysis: notebooks/05_ablation_analysis.ipynb
