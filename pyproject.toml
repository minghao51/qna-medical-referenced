[project]
name = "qna-medical-referenced"
version = "0.1.0"
description = "Medical Q&A chatbot with RAG pipeline for health screening interpretation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.129.0",
    "openai>=1.0.0",
    "pypdf>=4.0,<6.0",
    "pdfplumber>=0.11.4",
    "pymupdf>=1.24.0",
    "readability-lxml>=0.8.0",
    "pydantic-settings>=2.6.0",
    "uvicorn>=0.40.0",
    "nltk>=3.9.2",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.0",
    "markdownify>=0.14.0",
    "trafilatura>=1.12.2",
    "wandb>=0.23.0",
    "chromadb>=0.4.0",
    "bcrypt>=4.0.0",
    "litellm>=1.0.0",
    "google-genai>=1.0.0",
    "requests>=2.32.0",
    "urllib3>=2.0.0,<3.0.0",
    "polars>=1.0.0",
    "sf-hamilton[visualization]>=1.0.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
minversion = "9.0"
addopts = [
    "--strict-markers",
    "-ra",
    "--durations=10",
    "--import-mode=importlib",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast isolated tests (no I/O, no external deps)",
    "integration: tests with DB, filesystem, or service stack",
    "e2e: full end-to-end workflow tests",
    "slow: >1s tests",
    "live_api: requires live Qwen API access",
    "live_openrouter: requires live OpenRouter API access",
    "deepeval: DeepEval integration tests (slow, requires API)",
    "e2e_real_apis: end-to-end tests with real APIs (requires ENABLE_REAL_API_TESTS=1)",
    "network: needs internet access",
    "smoke: critical path tests",
    "serial: cannot run in parallel",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "DTZ", "T10",
    "ISC", "PIE", "PT", "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "PT011", "PT012", "PT017", "B017", "RUF012", "RUF059"]
"scripts/**/*.py" = ["DTZ005", "DTZ007"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.1",
    "mypy>=1.19.1",
    "playwright>=1.58.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
    "import-linter>=2.15",
]
evaluation = [
    "deepeval>=3.9.0,<4.0.0",
    "langchain<1",
    "langchain-community<1",
    "langchain-core<1",
    "langchain-openai<1",
]
chunkers = ["chonkie[semantic]>=1.0.0"]
extraction = ["camelot-py>=0.12.0"]
reranking = ["sentence-transformers>=3.0.0"]
medical = ["spacy>=3.8.0"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.0",
    "matplotlib>=3.8.0",
    "nbformat>=5.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "nbclient>=0.10.4",
]

[tool.uv]
no-build-isolation-package = ["grpcio"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]
disable_error_code = [
    "import-untyped",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B601"]  # Skip assert_used and paramiko_calls

[[tool.mypy.overrides]]
module = [
    "nltk.*",
    "google.*",
    "deepeval.*",
]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["src"]

# Roadmap D3.4 / §3.1: dependencies point left-to-right only:
# cli > app > usecases > {rag,evals,experiments} > {ingestion,infra} > core > config
# import-linter treats siblings in one layer as independent; these exemptions
# encode the sanctioned same-tier package pairs (eval/experiment runner edges
# are composition roots per §3.1; ingestion consumes infra LLM clients).
[[tool.importlinter.contracts]]
name = "Layered architecture (cli > app > usecases > domain > data > core > config)"
type = "layers"
layers = [
    "src.cli",
    "src.app",
    "src.usecases",
    "src.rag | src.evals | src.experiments",
    "src.ingestion | src.infra",
    "src.core",
    "src.config",
]
# Each entry MUST match at least one real import: import-linter treats an
# unmatched ignore_imports pattern as a hard failure, which forces this list
# to stay pruned when a sanctioned edge is refactored away.
ignore_imports = [
    "src.evals.** -> src.rag",
    "src.evals.** -> src.rag.**",
    "src.evals.** -> src.experiments.**",
    "src.experiments.** -> src.evals",
    "src.experiments.** -> src.evals.**",
    "src.experiments.** -> src.rag",
    "src.rag.** -> src.experiments.**",
    "src.ingestion.** -> src.infra.**",
]

# Explicit forbids from the roadmap (redundant with the layers contract, but
# they produce precise CI failure messages).
[[tool.importlinter.contracts]]
name = "infra must not import app"
type = "forbidden"
source_modules = ["src.infra"]
forbidden_modules = ["src.app"]

[[tool.importlinter.contracts]]
name = "ingestion must not import rag"
type = "forbidden"
source_modules = ["src.ingestion"]
forbidden_modules = ["src.rag"]

[[tool.importlinter.contracts]]
name = "usecases must not import cli"
type = "forbidden"
source_modules = ["src.usecases"]
forbidden_modules = ["src.cli"]
