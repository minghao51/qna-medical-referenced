services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      APP__APP__ENVIRONMENT: production
      APP__LLM__PROVIDER: ${APP__LLM__PROVIDER:-gemini}
      APP__LLM__MODEL_NAME: ${APP__LLM__MODEL_NAME:-qwen3.5-flash}
      APP__LLM__GEMINI_MODEL_NAME: ${APP__LLM__GEMINI_MODEL_NAME:-gemma-4-31b-it}
      APP__LLM__EMBEDDING_MODEL: ${APP__LLM__EMBEDDING_MODEL:-text-embedding-v4}
      APP__LLM__QWEN_BASE_URL: ${APP__LLM__QWEN_BASE_URL:-https://dashscope-us.aliyuncs.com/compatible-mode/v1}
      APP__LLM__DASHSCOPE_API_KEY: ${APP__LLM__DASHSCOPE_API_KEY:-}
      APP__LLM__GEMINI_API_KEY: ${APP__LLM__GEMINI_API_KEY:-}
      APP__LLM__OPENROUTER_API_KEY: ${APP__LLM__OPENROUTER_API_KEY:-}
      APP__API__SESSION_SIGNING_SECRET: ${APP__API__SESSION_SIGNING_SECRET:-}
      APP__API__API_KEYS: ${APP__API__API_KEYS:-}
      APP__API__API_KEYS_JSON: ${APP__API__API_KEYS_JSON:-}
      APP__API__RATE_LIMIT_PER_MINUTE: ${APP__API__RATE_LIMIT_PER_MINUTE:-60}
      APP__API__ANONYMOUS_CHAT_RATE_LIMIT_PER_MINUTE: ${APP__API__ANONYMOUS_CHAT_RATE_LIMIT_PER_MINUTE:-12}
      APP__API__RATE_LIMIT_BYPASS_KEY_IDS: ${APP__API__RATE_LIMIT_BYPASS_KEY_IDS:-}
      APP__API__RATE_LIMIT_BYPASS_ROLES: ${APP__API__RATE_LIMIT_BYPASS_ROLES:-}
      APP__API__CORS_ALLOWED_ORIGINS: ${APP__API__CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000,http://127.0.0.1:4173}
      APP__API__TRUST_PROXY_HEADERS: ${APP__API__TRUST_PROXY_HEADERS:-false}
      APP__RETRIEVAL__RETRIEVAL_OVERFETCH_MULTIPLIER: ${APP__RETRIEVAL__RETRIEVAL_OVERFETCH_MULTIPLIER:-4}
      APP__RETRIEVAL__MAX_CHUNKS_PER_SOURCE_PAGE: ${APP__RETRIEVAL__MAX_CHUNKS_PER_SOURCE_PAGE:-2}
      APP__RETRIEVAL__MAX_CHUNKS_PER_SOURCE: ${APP__RETRIEVAL__MAX_CHUNKS_PER_SOURCE:-3}
      APP__RETRIEVAL__MMR_LAMBDA: ${APP__RETRIEVAL__MMR_LAMBDA:-0.75}
      APP__RETRIEVAL__RRF_SEARCH_MODE: ${APP__RETRIEVAL__RRF_SEARCH_MODE:-rrf_hybrid}
      APP__STORAGE__COLLECTION_NAME: ${APP__STORAGE__COLLECTION_NAME:-medical_docs}
      APP__STORAGE__CHROMA_PERSIST_DIRECTORY: ${APP__STORAGE__CHROMA_PERSIST_DIRECTORY:-data/chroma-d11}
      APP__PRODUCTION__PRODUCTION_PROFILE: ${APP__PRODUCTION__PRODUCTION_PROFILE:-baseline}
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 5s
      retries: 5

  test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    profiles:
      - test
    working_dir: /app
    environment:
      - CI=true
      - PLAYWRIGHT_BASE_URL=http://frontend:5173
      - API_URL=http://backend:8000
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 1g
    depends_on:
      frontend:
        condition: service_healthy
