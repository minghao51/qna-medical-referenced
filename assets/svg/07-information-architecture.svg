<text id="label-42-migration" x="72" y="1023" font-size="12" font-weight="700" style="fill:#B5DACE" class="">MIGRATION</text>
<text id="label-43-keep-ask-evidence-and-current-route-aliases-retain-eval-" x="72" y="1056" font-size="16" font-weight="400" style="fill:#FFFFFF" class="">Keep /ask, /evidence and current route aliases; retain /eval, /eval/ablation, /experiments, /health, /settings and documentation.</text>
<text id="label-44-current-api-history-says-comparable-false-format-compati" x="72" y="1085" font-size="16" font-weight="400" style="fill:#FFFFFF" class="">Current API history says comparable=false. Format compatibility, matching row counts or an old winner label do not override it.</text>
