<text id="label-36-dataset-feature-experiment-archived-report-measurement-c" x="72" y="677" font-size="18" font-weight="400" style="fill:#182D32" class="">Dataset → feature experiment → archived report → measurement coverage → case expectations or recorded results.</text>
<text id="label-37-q-a-ask-selected-turn-recorded-rag-step-indexed-chunk-ev" x="72" y="707" font-size="18" font-weight="400" style="fill:#182D32" class="">Q&amp;A /ask → selected turn → recorded RAG step → indexed chunk /evidence/[id] → original source.</text>
<text id="label-38-access-and-execution" x="48" y="807" font-size="12" font-weight="700" style="fill:#006B61" class="">ACCESS AND EXECUTION</text>
<text id="label-39-private-lab-is-the-recorded-deployment-posture-public-cl" x="48" y="846" font-size="17" font-weight="400" style="fill:#182D32" class="">Private lab is the recorded deployment posture. Public clinical/demo rollout is not part of this design refinement.</text>
<text id="label-40-run-execution-remains-cli-yaml-first-the-web-ui-inspects" x="48" y="878" font-size="17" font-weight="400" style="fill:#182D32" class="">Run execution remains CLI/YAML-first; the web UI inspects artifacts. No “Run benchmark” button or default-profile switch.</text>
<text id="label-41-use-existing-logfire-tooling-for-approved-detailed-traci" x="48" y="910" font-size="17" font-weight="400" style="fill:#182D32" class="">Use existing Logfire tooling for approved detailed tracing; do not silently duplicate hosted traces or fabricate deep links.</text>
