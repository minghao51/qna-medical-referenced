<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1220" viewBox="0 0 390 1220" role="img" aria-labelledby="title description"><title id="title">Evidence explorer mobile with filter sheet</title><desc id="description">PDF selected in results. Proposed modal filter sheet shown below as an interaction specification.</desc>
