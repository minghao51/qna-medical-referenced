<rect x="48" y="1222" width="1344" height="112" fill="#FBECE2" rx="4"/>
<text x="72" y="1254" font-size="12" font-weight="700" style="fill:#B34322" class="">WHAT “FULL BREAKDOWN” DOES NOT MEAN</text>
<text x="72" y="1286" font-size="15" font-weight="400" style="fill:#182D32" class="">This is a stage ledger, not a provider/tool-call event log. Trace metadata arrives in the terminal SSE event.</text>
<text x="72" y="1312" font-size="15" font-weight="400" style="fill:#182D32" class="">No system prompt, hidden reasoning, exact token usage, cost, TTFT or call start/end timestamps are available in this contract.</text>
