<text x="330" y="287" font-size="20" font-weight="700" style="fill:#182D32" class="">What does the guidance say about shared decisions?</text>
<text x="330" y="331" font-size="11" font-weight="700" style="fill:#006B61" class="">FIELDNOTE</text>
<text x="330" y="371" font-size="18" font-weight="400" style="fill:#182D32" class="">The indexed guidance describes patient education and shared decision</text>
<text x="330" y="401" font-size="18" font-weight="400" style="fill:#182D32" class="">making as integral to starting insulin for people with type 2 diabetes. [1]</text>
<text x="330" y="431" font-size="18" font-weight="400" style="fill:#182D32" class="">It also highlights addressing concerns and discussing appropriate, safe use.</text>
<text x="330" y="461" font-size="18" font-weight="400" style="fill:#182D32" class="">The excerpt is incomplete; read the original with a qualified clinician.</text>
