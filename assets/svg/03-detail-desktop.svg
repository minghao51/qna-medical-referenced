<text x="76" y="357" font-size="12" font-weight="700" style="fill:#006B61" class="">THE INDEXED EXCERPT</text>
<text x="76" y="404" font-size="19" font-weight="400" style="fill:#182D32" class="serif">able to reach their glycaemic targets despite optimal treatment</text>
<text x="76" y="435" font-size="19" font-weight="400" style="fill:#182D32" class="serif">with non-insulin T2DM medications alone should be started on</text>
<text x="76" y="466" font-size="19" font-weight="400" style="fill:#182D32" class="serif">insulin therapy.</text>
<text x="76" y="497" font-size="19" font-weight="400" style="fill:#182D32" class="serif">5</text>
<text x="76" y="528" font-size="19" font-weight="400" style="fill:#182D32" class="serif">Patient education and shared decision making is integral to the</text>
<text x="76" y="559" font-size="19" font-weight="400" style="fill:#182D32" class="serif">successful initiation of insulin for patients with T2DM.</text>
<text x="76" y="590" font-size="19" font-weight="400" style="fill:#182D32" class="serif">Health care professionals play an important role in empowering</text>
<text x="76" y="621" font-size="19" font-weight="400" style="fill:#182D32" class="serif">patients and their caregivers by engaging them</text>
<text x="76" y="652" font-size="19" font-weight="400" style="fill:#182D32" class="serif">in discussions relating to insulin use, from addressing</text>
<text x="76" y="683" font-size="19" font-weight="400" style="fill:#182D32" class="serif">insulin-related concerns, to appropriate and safe use, and</text>
<line x1="76" y1="733" x2="870" y2="733" stroke="#CED5D0" stroke-width="1"/>
