<text x="430" y="916" font-size="12" font-weight="700" style="fill:#B34322" class="">NOT RECORDED AT INDIVIDUAL-CALL GRANULARITY</text>
<text x="430" y="951" font-size="15" font-weight="400" style="fill:#182D32" class="">Provider request / response, retry attempts, exact usage, cost and call start/end timestamps.</text>
<text x="430" y="978" font-size="15" font-weight="400" style="fill:#182D32" class="">Input and Output tabs show “not recorded for this step” unless supported by its real fields.</text>
<text x="48" y="1061" font-size="16" font-weight="400" style="fill:#506469" class="">Possible later extension: an authorized, redacted provider-call ledger. Requires a new schema, retention rules and privacy review.</text>
<text x="48" y="1089" font-size="16" font-weight="400" style="fill:#506469" class="">Do not expose model reasoning, credentials or raw SDK bodies. The current implementation slice should stop at recorded RAG steps.</text>
<line x1="48" y1="1128" x2="1392" y2="1128" stroke="#CED5D0" stroke-width="1"/>
<text x="48" y="1155" font-size="12" font-weight="400" style="fill:#506469" class="">DESIGN PROPOSAL • Repository snapshot, not a live service</text>
