<text x="72" y="821" font-size="22" font-weight="700" style="fill:#006B61" class="">+0.0392 nDCG@K   /   +248.5 ms median latency   /   2.05× the median retrieval time</text>
<text x="48" y="915" font-size="24" font-weight="400" style="fill:#182D32" class="serif">What this does—and does not—tell us</text>
<text x="48" y="954" font-size="16" font-weight="400" style="fill:#182D32" class="">54 queries from golden_queries_expanded.json. Comparison recovered in retrieval-only mode after answer evaluation stalled.</text>
<text x="48" y="983" font-size="16" font-weight="400" style="fill:#182D32" class="">The result supports a retrieval trade-off within this benchmark. It does not establish better medical answers or a causal latency estimate.</text>
<text x="48" y="1012" font-size="16" font-weight="400" style="fill:#182D32" class="">No confidence intervals are supplied. The separate 57-query experiment is not pooled into these charts.</text>
<text x="48" y="1074" font-size="14" font-weight="400" style="fill:#506469" class="">Served profile: baseline (read-only D11). Cross-encoder remains opt-in and requires optional dependencies + model assets.</text>
