<text x="48" y="176" font-size="42" font-weight="400" style="fill:#182D32" class="serif">Better retrieval has a latency cost.</text>
<text x="48" y="210" font-size="17" font-weight="400" style="fill:#506469" class="">A 54-query reranking comparison. This is an archived result, not the currently served runtime.</text>
